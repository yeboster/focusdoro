name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch makes an in-flight run pointless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test, and scan
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        # v2
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Report the toolchain
        run: |
          swift --version
          xcodebuild -version

      # Keyed on the manifest so a dependency change misses the cache; the Swift
      # version is in the key because .build is not portable across toolchains.
      - name: Cache SwiftPM build
        # v5
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            ${{ runner.os }}-spm-

      - name: Test
        run: make test

  app:
    name: Package the macOS app
    runs-on: macos-15
    timeout-minutes: 20
    needs: test
    steps:
      # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Build the disk image
        run: make dmg

      # The app is menu-bar-only and unsandboxed: if either the LSUIElement flag or
      # the bundle identifier goes missing, notifications and the Keychain item break
      # at runtime rather than at build time.
      - name: Verify the bundle
        run: |
          set -euo pipefail
          APP=build/Focusdoro.app
          test -x "$APP/Contents/MacOS/Focusdoro"
          plutil -lint "$APP/Contents/Info.plist"
          test "$(defaults read "$PWD/$APP/Contents/Info" CFBundleIdentifier)" = "so.bon.focusdoro"
          test "$(defaults read "$PWD/$APP/Contents/Info" CFBundleIconFile)" = "AppIcon"
          test "$(defaults read "$PWD/$APP/Contents/Info" LSUIElement)" = "1"
          test "$(defaults read "$PWD/$APP/Contents/Info" FocusdoroBuildCommit)" = "$GITHUB_SHA"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Verify the disk image
        run: Tests/verify-dmg.sh build/Focusdoro.dmg

      - name: Upload the disk image
        # v5
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: Focusdoro-macOS-DMG
          path: build/Focusdoro.dmg
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish immutable continuous release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: app
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified disk image
        # v5
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: Focusdoro-macOS-DMG
          path: release

      # This write-capable job does not check out or execute repository code.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="continuous-${GITHUB_SHA}"
          gh release create "$TAG" release/Focusdoro.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --title "Focusdoro ${GITHUB_SHA::7}" \
            --notes "Automatic build from main at ${GITHUB_SHA}." \
            --target "$GITHUB_SHA" \
            --latest
