name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch makes an in-flight run pointless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Report the toolchain
        run: |
          swift --version
          xcodebuild -version

      # Keyed on the manifest so a dependency change misses the cache; the Swift
      # version is in the key because .build is not portable across toolchains.
      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            ${{ runner.os }}-spm-

      - name: Test
        run: make test

  app:
    name: Package the macOS app
    runs-on: macos-15
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Build the disk image
        run: make dmg

      # The app is menu-bar-only and unsandboxed: if either the LSUIElement flag or
      # the bundle identifier goes missing, notifications and the Keychain item break
      # at runtime rather than at build time.
      - name: Verify the bundle
        run: |
          set -euo pipefail
          APP=build/Focusdoro.app
          test -x "$APP/Contents/MacOS/Focusdoro"
          plutil -lint "$APP/Contents/Info.plist"
          test "$(defaults read "$PWD/$APP/Contents/Info" CFBundleIdentifier)" = "so.bon.focusdoro"
          test "$(defaults read "$PWD/$APP/Contents/Info" CFBundleIconFile)" = "AppIcon"
          test "$(defaults read "$PWD/$APP/Contents/Info" LSUIElement)" = "1"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Verify the disk image
        run: Tests/verify-dmg.sh build/Focusdoro.dmg

      - name: Upload the disk image
        uses: actions/upload-artifact@v5
        with:
          name: Focusdoro-macOS-DMG
          path: build/Focusdoro.dmg
          retention-days: 14
          if-no-files-found: error
